services:
  mixpost:
    image: inovector/mixpost:latest
    container_name: barry-mixpost
    restart: unless-stopped
    environment:
      - APP_NAME=RAR Content Engine
      - APP_URL=http://mixpost.5.161.96.208.sslip.io
      - DB_HOST=mixpost-db
      - DB_DATABASE=mixpost
      - DB_USERNAME=mixpost
      - DB_PASSWORD=${MIXPOST_DB_PASSWORD}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    volumes:
      - mixpost-storage:/var/www/html/storage
    depends_on:
      - mixpost-db
      - redis
    labels:
      - traefik.enable=true
      - "traefik.http.routers.mixpost.rule=Host(`mixpost.5.161.96.208.sslip.io`)"
      - traefik.http.routers.mixpost.entryPoints=http
      - traefik.http.services.mixpost.loadbalancer.server.port=80

  mixpost-db:
    image: mysql:8.0
    container_name: barry-mixpost-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=mixpost
      - MYSQL_USER=mixpost
      - MYSQL_PASSWORD=${MIXPOST_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mixpost-db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: barry-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: barry-n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - WEBHOOK_URL=http://n8n.5.161.96.208.sslip.io
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/home/node/.n8n/database.sqlite
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      - traefik.enable=true
      - "traefik.http.routers.n8n.rule=Host(`n8n.5.161.96.208.sslip.io`)"
      - traefik.http.routers.n8n.entryPoints=http
      - traefik.http.services.n8n.loadbalancer.server.port=5678

volumes:
  mixpost-storage:
  mixpost-db-data:
  redis-data:
  n8n-data:
