# Mixpost platform configuration for RAR

platforms:
  instagram:
    enabled: true
    profile_id: ${UPLOAD_POST_IG_PROFILE}
    features:
      - posts
      - reels
      - stories
      - carousels
    posting_times:
      - "08:00"
      - "12:00"
      - "17:00"
    max_posts_per_day: 3

  facebook:
    enabled: true
    profile_id: ${UPLOAD_POST_FACEBOOK_PROFILE}
    features:
      - posts
      - reels
      - stories
    posting_times:
      - "09:00"
      - "13:00"
      - "18:00"
    max_posts_per_day: 2

  tiktok:
    enabled: true
    profile_id: ${UPLOAD_POST_TIKTOK_PROFILE}
    features:
      - videos
    posting_times:
      - "07:00"
      - "12:00"
      - "19:00"
    max_posts_per_day: 2

  twitter:
    enabled: true
    features:
      - posts
      - threads
    posting_times:
      - "08:00"
      - "12:00"
      - "17:00"
    max_posts_per_day: 4

# Content mix per month (90 posts = Dominator tier)
content_mix:
  instagram:
    reels: 8
    carousels: 8
    static_posts: 8
    stories: 6
  facebook:
    link_posts: 10
    video_posts: 5
    text_posts: 5
  tiktok:
    talking_head: 8
    text_overlay: 8
    trend_jacking: 6
  twitter:
    threads: 8
    single_tweets: 12

# Approval workflow
approval:
  enabled: true
  channel: ${SLACK_CHANNEL_ID}
  auto_approve_after_hours: 24
  require_approval_for:
    - tiktok
  auto_approve:
    - twitter
    - stories
