version: "3.9"

services:
  mixpost:
    image: inovector/mixpost:latest
    container_name: barry-mixpost
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_NAME=RAR Content Engine
      - APP_URL=${MIXPOST_APP_URL}
      - DB_HOST=mixpost-db
      - DB_DATABASE=mixpost
      - DB_USERNAME=mixpost
      - DB_PASSWORD=${MIXPOST_DB_PASSWORD}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    volumes:
      - mixpost-storage:/var/www/html/storage
    depends_on:
      - mixpost-db
      - redis
    networks:
      - barry-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  mixpost-db:
    image: mysql:8.0
    container_name: barry-mixpost-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=mixpost
      - MYSQL_USER=mixpost
      - MYSQL_PASSWORD=${MIXPOST_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mixpost-db-data:/var/lib/mysql
    networks:
      - barry-net

  redis:
    image: redis:7-alpine
    container_name: barry-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - barry-net

  n8n:
    image: n8nio/n8n:latest
    container_name: barry-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/home/node/.n8n/database.sqlite
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows:ro
    networks:
      - barry-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  apify-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.apify
    container_name: barry-apify-scheduler
    restart: unless-stopped
    environment:
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - ISABELLA_DATA_DIR=/data
    volumes:
      - apify-data:/data
    networks:
      - barry-net
    profiles:
      - isabella

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: barry-scheduler
    restart: unless-stopped
    environment:
      - N8N_URL=http://n8n:5678
      - N8N_USER=${N8N_USER}
      - N8N_PASSWORD=${N8N_PASSWORD}
      - MIXPOST_URL=http://mixpost
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    networks:
      - barry-net
    depends_on:
      - n8n
      - mixpost

volumes:
  mixpost-storage:
  mixpost-db-data:
  redis-data:
  n8n-data:
  apify-data:

networks:
  barry-net:
    driver: bridge
